events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream contract_extractor {
        server contract-extractor:8080;
    }

    upstream globas_api {
        server globas-api:8000;
    }

    upstream legal_ai {
        server legal-ai:8000;
    }

    upstream ai_economist {
        server ai-economist:8000;
    }

    server {
        listen 8000;

        client_max_body_size 25m;

        location /contract-extractor/ {
            rewrite ^/contract-extractor/(.*)$ /$1 break;
            proxy_pass http://contract_extractor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /globas/ {
            rewrite ^/globas/(.*)$ /$1 break;
            proxy_pass http://globas_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /legal-ai/ {
            rewrite ^/legal-ai/(.*)$ /$1 break;
            proxy_pass http://legal_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ai-economist/ {
            rewrite ^/ai-economist/(.*)$ /$1 break;
            proxy_pass http://ai_economist;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
