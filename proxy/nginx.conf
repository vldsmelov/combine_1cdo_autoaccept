events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream contract_extractor {
        server contract-extractor:8080;
    }

    upstream globas_syntetic {
        server globas-syntetic:8090;
    }

    upstream legal_ai {
        server legal-ai:8100;
    }

    server {
        listen 8000;

        location /contract-extractor/ {
            rewrite ^/contract-extractor/(.*)$ /$1 break;
            proxy_pass http://contract_extractor/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /globas-syntetic/ {
            rewrite ^/globas-syntetic/(.*)$ /$1 break;
            proxy_pass http://globas_syntetic/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /legal-ai/ {
            rewrite ^/legal-ai/(.*)$ /$1 break;
            proxy_pass http://legal_ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
